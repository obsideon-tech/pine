# Verification registry (PINE_PLAN.md §11 H2).
#
# What each built-in and each execution rule has been checked against. "Verified" is computed
# from this file: an entry is verified when at least one TradingView export confirmed it.
# tests/test_registry.py cross-checks it against the code (every public pine.ta function and
# runtime built-in has an entry, every probe group has a decision entry with the expected
# hypothesis the code implements, every referenced export, bound and mutation test exists),
# and the README table is generated from it: `python -m pine.registry --write README.md`.
#
# Exports themselves stay outside the repository (README "Data"); only these facts are kept.
# Evidence for each export is in PINE_PLAN.md §12.

schema: 1

exports:
  nflx_1d:
    symbol: BATS:NFLX
