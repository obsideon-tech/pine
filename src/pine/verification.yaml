# Per public pine.ta function.
#   pine:        the Pine name (null: Python-only helper)
#   runtime:     the pine.runtime ctx.ta method (null: none)
#   capture:     the capture script with its columns (reference | semantics | builtins | null)
#   tradingview: exports on which TradingView's values matched
#   na_policy:   exports on which its `na` handling was decided (as pine.ta's default)
#   bound:       input-rounding bound in pine.sensitivity: LIPSCHITZ:<key> or a function name
#                (null: none; the reason goes in `notes`)
#   mutation:    test file with its deliberate-bug cases (null: none yet)
builtins:
