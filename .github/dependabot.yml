# Dependabot (GitHub-native; no third-party service). Proposes PRs that bump the SHA-pinned
# actions and the uv lockfile; nothing merges without review (PINE_PLAN.md §7.2, §10 D2).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
