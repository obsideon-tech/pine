[project]
name = "pine-parity"
version = "0.0.1"
description = "Pine Script built-ins in Python, with a parity harness against TradingView exports."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
pine-lint = "pine.lint.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Pine snippets in tests are clearer on one line.
"tests/*" = ["E501"]
